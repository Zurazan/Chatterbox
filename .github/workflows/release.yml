name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Validate release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath Chatterbox.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag '$env:GITHUB_REF_NAME' must match project version 'v$version'."
          }
          "PLUGIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force

      - name: Restore locked dependencies
        run: dotnet restore Chatterbox.csproj --locked-mode

      - name: Build release package
        run: dotnet build Chatterbox.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Generate plugin repository
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'chatterbox-repository'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          .\scripts\New-PluginRepository.ps1 `
              -ManifestPath 'bin\Release\Chatterbox.json' `
              -Repository $env:GITHUB_REPOSITORY `
              -OutputPath (Join-Path $output 'repo.json')

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'bin\Release\Chatterbox\latest.zip'
          if (-not (Test-Path -LiteralPath $archive)) { throw "Missing release archive: $archive" }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME $archive --clobber
          } else {
              gh release create $env:GITHUB_REF_NAME $archive --verify-tag --generate-notes --title "Chatterbox $env:PLUGIN_VERSION"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

      - name: Publish repo branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'chatterbox-repository'
          $publish = Join-Path $env:RUNNER_TEMP 'chatterbox-repo-branch'
          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $source 'repo.json') -Destination (Join-Path $publish 'repo.json')

          git -C $publish init --initial-branch=repo
          git -C $publish config user.name 'github-actions[bot]'
          git -C $publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C $publish add --all
          git -C $publish commit -m "Publish Chatterbox $env:PLUGIN_VERSION"
          git -C $publish remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git -C $publish push --force origin repo
          if ($LASTEXITCODE -ne 0) { throw 'Repository branch publication failed.' }

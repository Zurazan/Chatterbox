name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force

      - name: Restore locked dependencies
        run: dotnet restore Chatterbox.csproj --locked-mode

      - name: Build release package
        run: dotnet build Chatterbox.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Validate repository manifest
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'repo.json'
          .\scripts\New-PluginRepository.ps1 `
              -ManifestPath 'bin\Release\Chatterbox.json' `
              -Repository $env:GITHUB_REPOSITORY `
              -OutputPath $output
          $repository = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($repository.Count -ne 1) { throw 'Repository feed must contain one plugin.' }
          if (-not (Test-Path -LiteralPath 'Chatterbox\images\Chatterbox.png')) { throw 'Missing repository icon.' }
          if ($repository[0].IconUrl -notlike '*/main/Chatterbox/images/Chatterbox.png') { throw 'Unexpected repository icon URL.' }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Chatterbox
          path: bin\Release\Chatterbox\latest.zip
          if-no-files-found: error
          retention-days: 7
